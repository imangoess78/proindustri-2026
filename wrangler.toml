# ProIndustri — Cloudflare Worker config
name = "proindustri"
main = "worker/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "proindustri.com", custom_domain = true }
]
# Static assets
[assets]
directory = "./public"
not_found_handling = "none"
# Worker harus jalan duluan utk SEMUA request (termasuk file statis) supaya
# security headers + no-cache diterapkan ke halaman statis juga (/, /artikel, site.js, dll)
run_worker_first = true

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "proindustri-db"
database_id = "f126ad23-5f75-4f96-850a-d25a0b564bb9"

# R2 storage for product images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "proindustri-images"

# Site config
[vars]
SITE_NAME = "ProIndustri"
SITE_URL = "https://proindustri.imangoess78.workers.dev"
# WhatsApp number for orders (format: 6281234567890)
WA_NUMBER = "6281394191904"
