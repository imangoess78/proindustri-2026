<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 14px; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 11px; margin-bottom: 12px; }
  .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; margin: 6px 0; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sec { background: #e2e8f0; color: #0f172a; }
  .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .lbl { color: #64748b; font-size: 11px; }
  .val { font-weight: 600; text-align: right; }
  #status { font-size: 11px; color: #64748b; margin-top: 8px; white-space: pre-wrap; }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
  .img { width: 100%; max-height: 120px; object-fit: cover; border-radius: 6px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>ProIndustri Scraper</h1>
  <div class="sub" id="page-info">Buka halaman produk Monotaro lalu klik Scrape.</div>

  <button class="btn" id="scrape-btn">🔍 Scrape Halaman Ini</button>
  <button class="btn sec" id="token-btn">🔑 Ambil Token Otomatis</button>

  <div id="result"></div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
